name: tests

on:
  push:
    branches: [main, v4]
  pull_request:

jobs:
  node-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:baseline
      - run: npm run test:phase0
      - run: npm run test:phase1
      - run: npm run test:phase2
      - run: npm run test:phase3
