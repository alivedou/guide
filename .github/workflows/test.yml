name: tests

on:
  push:
    branches: [main, v4]
  pull_request:

jobs:
  node-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:baseline
      - run: npm run test:phase0
      - run: npm run test:phase1
      - run: npm run test:phase2
      - run: npm run test:phase3
      - run: node --test --test-concurrency=1 tests/phase4/*.test.mjs tests/unit/sanitize.test.mjs tests/unit/bg-resolve.test.mjs
      - run: node --test --test-concurrency=1 tests/phase5/*.test.mjs
      - run: npm run sql:check

  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/smoke.spec.ts tests/e2e/search.spec.ts tests/e2e/admin.spec.ts tests/e2e/visual.spec.ts tests/e2e/responsive.spec.ts tests/e2e/background.spec.ts tests/e2e/zen-nav.spec.ts
        env:
          CI: true
