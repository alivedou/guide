name: Build and Publish ikun-nav Docker Image

on:
  workflow_dispatch: # 允许在 GitHub Actions 页面手动点击一键触发构建
    # 👇 新增：在手动触发时，弹窗让用户/你自己输入版本号
    inputs:
      version:
        description: '请输入本次构建的 Docker 镜像 Tag (例如: v1.0.0，不填则默认只更新 latest)'
        required: false
        default: ''

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # 100% 对齐您本地与 Docker 的 Node.js 22 环境

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ikun_nav
          # 👇 修改这里的 tags 逻辑：完美联动手动输入的版本号 👇
          tags: |
            type=raw,value=latest
            type=sha,format=short
            ${{ github.event.inputs.version != '' && format('type=raw,value={0}', github.event.inputs.version) || '' }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max