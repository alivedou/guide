#
# ⚠️ Pages Root = nav-main 时，Cloudflare Pages 不会读这个根目录 wrangler.toml。
# 真正生效的是 nav-main/wrangler.toml（nodejs_compat / jose）。
# 绑定（KV `nav`、D1 `DB`）在 Pages 控制台配置。本文件仅便于在仓库根执行 wrangler 子命令时看到兼容日期。

compatibility_date = "2024-05-28"
compatibility_flags = ["nodejs_compat"]
